name: validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Schema + cross-reference + PIP
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run events validator
        run: python3 validators/validate_events.py

      - name: Run threads validator
        run: python3 validators/validate_threads.py

      - name: Run people validator
        run: python3 validators/validate_people.py

  render:
    name: Browser regression tests
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Playwright
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Rebuild HTML (data + template → web/india-history.html)
        # Skips build_map.py — uses the committed map_paths.json so we don't
        # need the 200+ MB Datameet clone in CI.
        run: python3 build/build_html.py

      - name: render_test_v2
        run: python3 tests/render_test_v2.py

      - name: render_test_popover
        run: python3 tests/render_test_popover.py

      - name: render_test_zoom
        run: python3 tests/render_test_zoom.py

      - name: render_test_people
        run: python3 tests/render_test_people.py

      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: render-test-screenshots
          path: tests/artifacts/
          if-no-files-found: ignore
          retention-days: 7
